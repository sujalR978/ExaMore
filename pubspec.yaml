name: prep_mate
description: "Smart online exam platform with secure proctoring, test banks & instant scores."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  provider: ^6.1.5+1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  intl: ^0.20.3
  file_picker: ^8.1.2
  flutter_json: ^0.1.0
  csv: ^8.0.0
  shared_preferences: ^2.5.6
  share_plus: ^12.0.2
  firebase_messaging: ^16.7.1
  local_auth: ^3.0.2
  flutter_local_notifications: 17.2.4



flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  package_rename: ^1.10.1

package_rename_config:
  android:
    app_name: "ExaMore" # Display name
    package_name: "com.rishvi.examore" # Package name
    override_old_package: "com.example.rishvi" # Optional: Cleans up old folder structure
    lang: "kotlin" # Optional: "kotlin" (default) or "java"

  ios:
    app_name: "ExaMore" # Display name
    bundle_name: "ExaMore" # Bundle name
    package_name: "com.rishvi.examore" # Product Bundle Identifier

  linux:
    app_name: "ExaMore" # Window title
    package_name: "com.rishvi.examore" # Application ID
    exe_name: "examore" # Executable name (binary)

  macos:
    app_name: "ExaMore" # Product name
    package_name: "com.rishvi.examore" # Product Bundle Identifier
    copyright_notice: "Copyright © 2024" # Copyright notice

  web:
    app_name: "ExaMore" # App title & PWA name
    short_app_name: "App" # PWA short name (defaults to app_name)
    description: "Smart online exam platform with secure proctoring, test banks & instant scores." # Web app description

  windows:
    app_name: "ExaMore" # Window title & Software name
    organization: "My Org" # Organization/Company name
    copyright_notice: "Copyright © 2024" # Legal copyright
    exe_name: "my_app" # Executable name (binary)
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/image/

